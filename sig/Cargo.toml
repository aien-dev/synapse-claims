# INTERIM host implementation: Ed25519 is not available in seeded Omega at the pinned omega-mv.
# See ../docs/EXTENSION-PROPOSALS.md. Remove this crate once om/ carries a gated Ed25519 unit.
[package]
name = "synapse-claims-sig"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-dev/synapse-claims"
description = "INTERIM Ed25519 keygen/sign/verify helper for the synapse-claims ledger (reuses synapse-core did:key)"
publish = false

[[bin]]
name = "synapse-claims-sig"
path = "src/main.rs"

[dependencies]
# Exact versions from aien-dev/synapse@099a980fedab8a6797bbf0358b8c5502c8045142 Cargo.lock
# (sha2 0.10.9 arrives through ed25519-dalek and is pinned by Cargo.lock; SHA-256 itself is om/tls/sha2.om).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
hex = "=0.4.3"
# `../.synapse` is a symlink build.sh creates to a checkout of aien-dev/synapse at ../synapse.pin
# (git-ignored; outside this workspace so synapse-core keeps its own workspace inheritance).
# A path dependency keeps --offline builds and the lockfile identical everywhere.
synapse-core = { path = "../.synapse/crates/synapse-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
